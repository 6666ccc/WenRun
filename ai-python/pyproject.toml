# 项目元数据与依赖声明（PEP 621 标准）
# 安装：pip install -e .

[project]
name = "wenrun-ai"
version = "0.1.0"
description = "WenRun FastAPI service skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv",
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "pydantic-settings",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "langchain",
  "langchain-core",
  "langchain-openai",
  "langchain-qdrant",
  "qdrant-client",
  "pypdf",
  "python-docx",
  "python-multipart",
  "loguru",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
