services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wenrun}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/SQL/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./docs/SQL/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend-java:
    build:
      context: ./backend-java
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/wenrun?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-python:8000}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?请在 .env 中设置 AI_SERVICE_API_KEY}
      AI_DELEGATION_SIGNING_SECRET: ${AI_DELEGATION_SIGNING_SECRET:?请在 .env 中设置 AI_DELEGATION_SIGNING_SECRET}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-8h}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_USERNAME: ${SPRING_DATA_REDIS_USERNAME:-}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
      SPRING_DATA_REDIS_SSL_ENABLED: ${SPRING_DATA_REDIS_SSL_ENABLED:-false}
      WENRUN_AUTH_SESSION_STORE: ${WENRUN_AUTH_SESSION_STORE:-redis}
      WENRUN_CORS_ALLOWED_ORIGINS: ${WENRUN_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOGGING_CHARSET_CONSOLE: UTF-8
      LOGGING_PATTERN_CONSOLE: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-python:
        condition: service_healthy

  ai-python:
    build:
      context: ./ai-python
    env_file:
      - ./ai-python/.env
    ports:
      - "8000:8000"
    environment:
      AI_INTERNAL_API_KEY: ${AI_SERVICE_API_KEY:?请在 .env 中设置 AI_SERVICE_API_KEY}
      AI_DELEGATION_SIGNING_SECRET: ${AI_DELEGATION_SIGNING_SECRET:?请在 .env 中设置 AI_DELEGATION_SIGNING_SECRET}
      JAVA_TOOL_BASE_URL: ${JAVA_TOOL_BASE_URL:-http://backend-java:8080}
      AI_REDIS_URL: ${AI_REDIS_URL:-redis://redis:6379/1}
      AI_CHECKPOINT_TTL_MINUTES: ${AI_CHECKPOINT_TTL_MINUTES:-1440}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_PROXY_TARGET: http://backend-java:8080
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - backend-java

volumes:
  mysql-data:
