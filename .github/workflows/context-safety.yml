name: Context safety

on:
  push:
  pull_request:

jobs:
  deterministic-context-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[test]"
      - name: Isolation and context safety tests
        run: >-
          python -m pytest
          tests/unit/test_context_builder.py
          tests/unit/test_context_metrics.py
          tests/unit/test_context_eval.py
          tests/unit/test_rag_lifecycle.py
          tests/unit/test_rehydration.py
          -q
      - name: Deterministic context evaluation
        run: python scripts/evaluate_context.py
